[package]
name = "hyperscale-types"
version.workspace = true
edition.workspace = true
description = "Core types for Hyperscale consensus"

[dependencies]
# Cryptographic primitives
blake3.workspace = true
hex.workspace = true
rand.workspace = true

# Consensus crypto interface (role newtypes, Signer/Verifier)
hyperscale-crypto.workspace = true
# BLS impl for the test-utils fixtures (deterministic committees)
hyperscale-crypto-bls = { workspace = true, optional = true }

# Merkle proof verification (Verify<ProvisionsContext>)
hyperscale-jmt.workspace = true

# Serialization
sbor.workspace = true

# Error handling
thiserror.workspace = true

# Diagnostics
tracing.workspace = true

# Radix transaction types
radix-common.workspace = true
radix-engine-interface.workspace = true
radix-transactions.workspace = true
radix-substate-store-interface.workspace = true

[features]
test-utils = ["dep:hyperscale-crypto-bls"]

[dev-dependencies]
blst.workspace = true
hyperscale-crypto-bls.workspace = true
proptest.workspace = true
syn = { version = "2.0.119", features = ["full", "parsing", "visit"] }

[lints]
workspace = true
