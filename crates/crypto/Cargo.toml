[package]
name = "hyperscale-crypto"
version.workspace = true
edition.workspace = true
description = "Consensus crypto interface: role newtypes and Signer/Verifier traits"

[features]
# Exposes the scheme conformance battery for impl crates' test suites.
test-utils = []

[dependencies]
# Interface-only crate: an external verifier must be able to depend on this
# plus one impl crate without dragging in the workspace. Keep it this way —
# blake3 is here for the canonical proof-to-output VRF digest, nothing else.
blake3.workspace = true
sbor.workspace = true
thiserror.workspace = true

[lints]
workspace = true
